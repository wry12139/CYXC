<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2F6B4F" />
  <title>财小白 · 每天5分钟</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,600;0,700;0,800;1,700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#2F6B4F', dark: '#234F3B', light: '#4E9E77', tint: '#E7EFE3' },
            amber: { DEFAULT: '#E08A3C', dark: '#C06E24' },
            clay: { DEFAULT: '#C1553B', dark: '#9E4230', tint: '#F6E5DE' },
            paper: { DEFAULT: '#F7F4EC', card: '#FFFDF7', line: '#EBE5D6' },
            ink: { DEFAULT: '#2A2724', soft: '#6B6459', faint: '#9C9486' },
          },
          fontFamily: {
            sans: ['Nunito', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    [x-cloak] { display: none !important; }
    html, body { -webkit-tap-highlight-color: transparent; }
    body { background: #F7F4EC; font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    /* 数字/英文情绪锚点:圆润有性格,等宽数字防跳动 */
    .num { font-variant-numeric: tabular-nums; font-weight: 800; letter-spacing: -0.01em; }
    .skeleton { background: linear-gradient(90deg,#ECE6D8 25%,#F5F1E7 37%,#ECE6D8 63%); background-size: 400% 100%; animation: sk 1.4s ease infinite; }
    @keyframes sk { 0% { background-position: 100% 50% } 100% { background-position: 0 50% } }
    .card-body [data-term] { color: #2F6B4F; border-bottom: 1px dashed #9CB8A6; cursor: pointer; }
    :focus-visible { outline: 2px solid #2F6B4F; outline-offset: 2px; }
    /* 招牌:打卡区暖阳渐变 + 成长意象 */
    .grow-hero { background: linear-gradient(135deg, #FBF3E4 0%, #EFF3E6 55%, #E7EFE3 100%); }
    @media (prefers-reduced-motion: no-preference) {
      .sprout { animation: sprout .5s cubic-bezier(.34,1.56,.64,1) both; }
      @keyframes sprout { from { transform: translateY(4px) scale(.85); opacity: 0 } to { transform: none; opacity: 1 } }
    }
    /* iOS 安全区适配(修复 P2-03):底部固定元素避开 Home 指示条 */
    .pb-safe-nav { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .pb-safe-sheet { padding-bottom: calc(2rem + env(safe-area-inset-bottom, 0px)); }
  </style>
</head>
<body class="bg-paper text-ink min-h-screen" x-data="finrookieApp" x-init="init()" x-cloak>

  <!-- 全局运行时错误兜底横幅(§6):可点击关闭,5秒自动消失 -->
  <div id="global-error" class="hidden fixed top-0 inset-x-0 z-50 bg-red-600 text-white text-sm py-2 px-4 flex items-center justify-center gap-3"
    onclick="this.classList.add('hidden')">
    <span>出了点小问题,可刷新页面试试</span>
    <span class="text-white/70 text-xs">✕ 点此关闭</span>
  </div>

  <!-- 桌面包裹层:大屏(lg+)顶部导航 + 全宽内容;移动端整体不生效 -->
  <div class="lg:min-h-screen">

    <!-- ============ 桌面顶部导航栏(仅 lg+ 显示,替代底部 tab)============ -->
    <header x-show="route !== 'onboarding'"
      class="hidden lg:flex lg:items-center lg:justify-between lg:gap-6 lg:sticky lg:top-0 lg:z-30 lg:px-8 lg:py-3 lg:bg-paper-card/90 lg:backdrop-blur lg:border-b lg:border-paper-line">
      <!-- 品牌(左上)-->
      <div class="flex items-center gap-2">
        <span class="text-2xl">🌱</span>
        <span class="text-xl font-extrabold text-ink">财<span class="text-brand">小白</span></span>
      </div>

      <!-- 导航 + 打卡(右上)-->
      <nav class="flex items-center gap-1">
        <template x-for="tab in [{k:'home',t:'今日',i:'📖'},{k:'briefing',t:'早报',i:'📰'},{k:'me',t:'我的',i:'👤'}]" :key="tab.k">
          <button type="button" @click="go(tab.k)"
            class="flex items-center gap-2 rounded-xl px-4 py-2 text-sm font-bold transition"
            :class="route === tab.k ? 'bg-brand-tint text-brand-dark' : 'text-ink-soft hover:bg-paper-line/50'">
            <span x-text="tab.i"></span>
            <span x-text="tab.t"></span>
          </button>
        </template>
        <!-- 打卡 + 档位徽章 -->
        <div class="flex items-center gap-2 ml-3 pl-4 border-l border-paper-line">
          <span class="text-xl sprout" x-text="growEmoji"></span>
          <div class="flex items-baseline gap-1">
            <span class="num text-lg text-brand-dark leading-none" x-text="streak"></span>
            <span class="text-xs text-ink-soft font-bold">天</span>
          </div>
          <span class="text-xs bg-brand text-white px-2.5 py-1 rounded-full font-bold ml-1" x-text="levelLabels[tags.level] || levelLabels.L1"></span>
        </div>
      </nav>
    </header>

  <main class="max-w-md mx-auto lg:max-w-none lg:mx-0 min-h-screen flex flex-col">

    <!-- ============ 输入区:F-08 一屏三问(onboarding)============ -->
    <section x-show="route === 'onboarding'" class="flex-1 flex flex-col px-6 py-8 lg:max-w-md lg:w-full lg:mx-auto lg:justify-center">
      <header class="mb-7">
        <span class="text-4xl sprout inline-block mb-3">🌱</span>
        <h1 class="text-3xl font-extrabold text-ink leading-tight">欢迎来到<span class="text-brand">财小白</span></h1>
        <p class="text-ink-soft mt-2 text-sm">30 秒了解你,给你最合适的内容</p>
      </header>

      <!-- Q1 身份 -->
      <div class="mb-6">
        <p class="font-semibold mb-3">你的身份是?</p>
        <div class="grid grid-cols-3 gap-2">
          <template x-for="opt in [{k:'student',t:'在校学生'},{k:'worker',t:'职场新人'},{k:'other',t:'其他'}]" :key="opt.k">
            <button type="button" @click="onboarding.identity = opt.k"
              :class="onboarding.identity === opt.k ? 'bg-brand text-white border-brand' : 'bg-paper-card border-paper-line text-ink-soft'"
              class="border rounded-xl py-3 text-sm font-medium transition" x-text="opt.t"></button>
          </template>
        </div>
      </div>

      <!-- Q2 水平 -->
      <div class="mb-6">
        <p class="font-semibold mb-3">你的金融水平?</p>
        <div class="grid grid-cols-3 gap-2">
          <template x-for="opt in [{k:'none',t:'完全没接触'},{k:'little',t:'懂一点'},{k:'some',t:'有点基础'}]" :key="opt.k">
            <button type="button" @click="onboarding.level = opt.k"
              :class="onboarding.level === opt.k ? 'bg-brand text-white border-brand' : 'bg-paper-card border-paper-line text-ink-soft'"
              class="border rounded-xl py-3 text-sm font-medium transition" x-text="opt.t"></button>
          </template>
        </div>
      </div>

      <!-- Q3 兴趣多选 -->
      <div class="mb-8">
        <p class="font-semibold mb-3">你想先学什么?<span class="text-ink-faint text-xs font-normal">(可多选)</span></p>
        <div class="flex flex-wrap gap-2">
          <template x-for="opt in [{k:'basics',t:'理财基础'},{k:'fund',t:'基金'},{k:'stock',t:'股票'},{k:'avoid_pit',t:'避坑'},{k:'insurance',t:'保险'}]" :key="opt.k">
            <button type="button" @click="toggleInterest(opt.k)"
              :class="onboarding.interests.includes(opt.k) ? 'bg-brand-tint text-brand-dark border-brand' : 'bg-paper-card border-paper-line text-ink-soft'"
              class="border rounded-full px-4 py-2 text-sm font-medium transition" x-text="opt.t"></button>
          </template>
        </div>
      </div>

      <div class="mt-auto space-y-3">
        <button type="button" @click="submitOnboarding()" :disabled="!canSubmitOnboarding"
          :class="canSubmitOnboarding ? 'bg-brand text-white shadow-[0_4px_14px_rgba(47,107,79,0.3)]' : 'bg-paper-line text-ink-faint'"
          class="w-full rounded-2xl py-3.5 font-bold transition">开始学习</button>
        <button type="button" @click="skipOnboarding()" class="w-full text-ink-faint text-sm py-1">先跳过,直接看看</button>
      </div>
    </section>

    <!-- ============ 首页 + 结果展示区:F-01 知识卡(home)============ -->
    <section x-show="route === 'home'" class="flex-1 flex flex-col lg:max-w-3xl lg:w-full lg:mx-auto lg:px-8 lg:pt-8">
      <!-- 术语搜索栏(今日一课上方):查专业名词解释 -->
      <div class="px-5 pt-5 pb-2">
        <form @submit.prevent="search()" class="relative">
          <input type="search" x-model="searchQuery" enterkeyhint="search"
            placeholder="搜专业术语,如 复利、ETF、市盈率"
            class="w-full bg-paper-card border border-paper-line rounded-2xl pl-10 pr-9 py-2.5 text-sm text-ink placeholder:text-ink-faint shadow-sm focus:border-brand focus:outline-none" />
          <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-ink-soft text-sm">🔍</span>
          <button type="button" x-show="searchQuery" @click="exitSearch()"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-ink-soft text-lg leading-none">×</button>
        </form>
      </div>

      <!-- 招牌:暖阳成长打卡区(桌面已在侧边栏展示,故 lg:hidden)-->
      <header class="mx-5 mb-3 grow-hero rounded-3xl px-5 py-4 flex items-center justify-between lg:hidden">
        <div class="flex items-center gap-3">
          <span class="text-3xl sprout" x-text="growEmoji"></span>
          <div>
            <div class="flex items-baseline gap-1.5">
              <span class="num text-3xl text-brand-dark leading-none" x-text="streak"></span>
              <span class="text-sm text-ink-soft font-bold">天连续</span>
            </div>
            <p class="text-xs text-brand mt-1 font-bold" x-text="streakMessage"></p>
          </div>
        </div>
        <span class="text-xs bg-brand text-white px-3 py-1.5 rounded-full font-bold shadow-sm" x-text="levelLabels[tags.level] || levelLabels.L1"></span>
      </header>

      <header class="px-5 pb-2">
        <h1 class="text-xl font-extrabold text-ink">今日一课</h1>
      </header>

      <div class="px-5 pb-24 flex-1">

        <!-- 搜索结果态:替换今日一课卡片区,展示术语解释 -->
        <div x-show="searchMode" x-cloak>
          <button type="button" @click="exitSearch()" class="text-sm text-brand font-medium mb-3">← 返回今日一课</button>
          <!-- 命中:术语解释卡(复用知识卡视觉)-->
          <template x-if="activeSearchTerm">
            <article class="bg-paper-card rounded-2xl shadow-sm border border-paper-line overflow-hidden">
              <div class="p-5">
                <div class="flex items-center gap-2 mb-3">
                  <span class="text-xs bg-brand text-white px-2 py-0.5 rounded">术语</span>
                </div>
                <h2 class="text-lg font-bold text-ink mb-3" x-text="activeSearchTerm"></h2>
                <p class="text-ink-soft leading-relaxed text-[15px]" x-text="activeSearchText"></p>
              </div>
              <div class="flex border-t border-paper-line">
                <button type="button" @click="toggleTermFav(activeSearchTerm)"
                  class="flex-1 py-3.5 text-sm font-medium"
                  :class="isTermFav(activeSearchTerm) ? 'text-amber' : 'text-ink-soft'"
                  x-text="isTermFav(activeSearchTerm) ? '★ 已收藏' : '☆ 收藏'"></button>
              </div>
            </article>
          </template>
          <!-- 其他匹配:可点切换 -->
          <div x-show="searchResults.length > 1" class="mt-4">
            <p class="text-xs text-ink-faint mb-2">其他相关术语</p>
            <div class="flex flex-wrap gap-2">
              <template x-for="t in searchResults" :key="t">
                <button type="button" @click="selectSearchResult(t)"
                  class="text-xs px-2.5 py-1 rounded-full border transition"
                  :class="activeSearchTerm === t ? 'bg-brand text-white border-brand' : 'bg-paper-card text-brand-dark border-paper-line'"
                  x-text="'#' + t"></button>
              </template>
            </div>
          </div>
          <!-- 未命中空态 -->
          <div x-show="!activeSearchTerm">
            <!-- 已登录:直接 AI 兜底(loading → 答案),不再显示"没找到" -->
            <template x-if="isAuthed">
              <div class="text-left py-4">
                <div x-show="aiAsking" class="py-10 text-center text-ink-soft">正在问 AI…</div>
                <div x-show="aiError" x-text="aiError" class="py-8 text-center text-clay"></div>
                <!-- 回答卡:x-text 渲染纯文本,无裸读属性,天然安全 -->
                <article x-show="aiAnswer" x-cloak class="rounded-3xl bg-paper-card p-4 shadow-soft">
                  <p class="text-ink leading-relaxed" x-text="aiAnswer"></p>
                  <p x-show="aiCached" class="mt-2 text-xs text-ink-faint">⚡ 秒回</p>
                  <p class="mt-3 text-xs text-ink-soft">AI 科普仅供学习,不构成投资建议</p>
                </article>
              </div>
            </template>
            <!-- 未登录:没找到 + 引导登录 -->
            <template x-if="!isAuthed">
              <div class="text-center py-16">
                <div class="text-5xl mb-4">🔍</div>
                <p class="text-ink-soft font-medium" x-text="'没找到「' + searchQuery + '」'"></p>
                <p class="text-ink-faint text-sm mt-1">登录后可以问 AI 哦</p>
              </div>
            </template>
          </div>
        </div>

        <!-- 以下为常规今日一课(搜索态时隐藏)-->
        <template x-if="!searchMode">
        <div>

        <!-- 加载骨架屏(§6 超时/加载态)-->
        <div x-show="loading" class="space-y-3">
          <div class="skeleton h-6 w-2/3 rounded"></div>
          <div class="skeleton h-40 w-full rounded-2xl"></div>
          <div class="skeleton h-4 w-full rounded"></div>
          <div class="skeleton h-4 w-5/6 rounded"></div>
        </div>

        <!-- 错误态:内容拉取失败/超时(§6, 任务4)-->
        <div x-show="!loading && contentError" class="text-center py-16">
          <div class="text-5xl mb-4">📡</div>
          <p class="text-ink-soft font-medium" x-text="contentError && contentError.code === 'TIMEOUT' ? '加载超时了' : '内容没加载出来'"></p>
          <p class="text-ink-faint text-sm mt-1">检查下网络,或稍后再试</p>
          <button type="button" @click="retryContent()" class="mt-5 bg-brand text-white rounded-xl px-6 py-2.5 font-medium">重试</button>
        </div>

        <!-- 空状态:内容库为空(§6, 任务4)-->
        <div x-show="!loading && !contentError && isEmptyLibrary" class="text-center py-16">
          <div class="text-5xl mb-4">📭</div>
          <p class="text-ink-soft font-medium">今天的内容还在准备中</p>
          <p class="text-ink-faint text-sm mt-1">稍后再来看看吧</p>
        </div>

        <!-- 复习模式:全部学完(§4.2 兜底)-->
        <div x-show="!loading && !contentError && !isEmptyLibrary && isReviewMode" class="text-center py-16">
          <div class="text-5xl mb-4">🎉</div>
          <p class="text-ink-soft font-medium">今天的新卡都学完啦</p>
          <p class="text-ink-faint text-sm mt-1">去「我的」复习之前的内容吧</p>
        </div>

        <!-- 结果展示区:知识卡 -->
        <article x-show="!loading && !contentError && todayCard" class="bg-paper-card rounded-3xl shadow-[0_4px_20px_rgba(42,39,36,0.06)] border border-paper-line overflow-hidden"
          @click="handleBodyClick($event)">
          <div class="p-5">
            <div class="flex items-center gap-2 mb-3">
              <span class="text-xs bg-brand-tint text-brand-dark px-2.5 py-0.5 rounded-full font-bold" x-text="todayCard && levelLabels[todayCard.difficulty]"></span>
              <span x-show="cardReasonLabel" class="text-xs text-amber font-bold" x-text="cardReasonLabel"></span>
            </div>
            <h2 class="text-xl font-extrabold text-ink mb-3 leading-snug" x-text="todayCard && todayCard.title"></h2>
            <div class="card-body text-ink-soft leading-relaxed text-[15px] space-y-2" x-html="todayCard && todayCard.body"></div>
          </div>
          <div class="flex border-t border-paper-line">
            <button type="button" @click.stop="todayCard && toggleFav(todayCard.id)"
              class="flex-1 py-3.5 text-sm font-bold border-r border-paper-line transition"
              :class="todayCard && isFav(todayCard.id) ? 'text-amber' : 'text-ink-soft'"
              x-text="todayCard && isFav(todayCard.id) ? '★ 已收藏' : '☆ 收藏'"></button>
            <button type="button" x-show="todayCard && todayCard.quizIds && todayCard.quizIds.length"
              @click.stop="openQuizForCard(todayCard)"
              class="flex-1 py-3.5 text-sm font-bold text-amber border-r border-paper-line">测一测 ✏️</button>
            <button type="button" @click.stop="nextCard()" class="flex-1 py-3.5 text-sm font-bold text-brand">学会了 →</button>
          </div>
        </article>

        <!-- ============ 延伸阅读:与当前知识卡主题相关的科普(移动+桌面都显示)============ -->
        <section x-show="!loading && !contentError && todayCard && relatedArticles.length" x-cloak class="mt-6">
          <div class="flex items-center gap-2 mb-3">
            <span class="text-base">📚</span>
            <h3 class="text-sm font-extrabold text-ink">延伸阅读</h3>
            <span class="text-xs text-ink-faint font-normal">和这一课相关的科普</span>
          </div>
          <div class="space-y-3 lg:space-y-0 lg:grid lg:grid-cols-2 lg:gap-3">
            <template x-for="art in relatedArticles" :key="art.id">
              <article class="bg-paper-card rounded-2xl border border-paper-line overflow-hidden shadow-[0_2px_10px_rgba(42,39,36,0.04)] lg:self-start">
                <button type="button" @click="toggleArticle(art.id)" class="w-full text-left p-4">
                  <h4 class="font-bold text-ink text-[15px] leading-snug mb-1.5" x-text="art.title"></h4>
                  <p class="text-ink-soft text-sm leading-relaxed" x-text="art.lead"></p>
                  <div class="flex items-center justify-between mt-2.5">
                    <span class="text-[11px] text-ink-faint" x-text="art.source"></span>
                    <span class="text-xs text-brand font-bold" x-text="isArticleExpanded(art.id) ? '收起 ▲' : '展开全文 ▼'"></span>
                  </div>
                </button>
                <!-- 展开的正文 + 可选权威外链 -->
                <div x-show="isArticleExpanded(art.id)" x-cloak class="px-4 pb-4 -mt-1">
                  <div class="card-body border-t border-paper-line pt-3 text-ink-soft leading-relaxed text-sm space-y-2" x-html="art.body" @click="handleBodyClick($event)"></div>
                  <a x-show="art.url" :href="art.url" target="_blank" rel="noopener noreferrer"
                    class="inline-flex items-center gap-1 mt-3 text-xs font-bold text-brand bg-brand-tint rounded-full px-3 py-1.5">
                    <span x-text="'延伸来源:' + art.urlLabel"></span>
                    <span>↗</span>
                  </a>
                </div>
              </article>
            </template>
          </div>
        </section>

        <p class="text-center text-[11px] text-ink-faint mt-6">仅供学习,不构成投资建议</p>

        </div>
        </template>
        <!-- /常规今日一课 -->
      </div>
    </section>

    <!-- ============ 早报:F-04 财经要闻 ============ -->
    <section x-show="route === 'briefing'" class="flex-1 px-5 pt-6 pb-24 lg:pb-10 lg:max-w-5xl lg:w-full lg:mx-auto lg:px-8 lg:pt-8">
      <div class="flex items-center justify-between mb-1">
        <h1 class="text-xl font-bold text-brand-dark">财经早报</h1>
        <span x-show="briefing" class="text-xs text-ink-faint" x-text="briefing && briefing.date"></span>
      </div>

      <!-- 往期日期切换:横向可滚动 chip -->
      <div x-show="briefingDates.length > 1" x-cloak class="flex gap-2 overflow-x-auto pb-1 mb-2 -mx-1 px-1">
        <template x-for="d in briefingDates" :key="d">
          <button type="button" @click="showBriefing(d)"
            class="shrink-0 text-xs px-3 py-1.5 rounded-full border transition"
            :class="activeBriefingDate === d ? 'bg-brand text-white border-brand font-medium' : 'bg-paper-card text-ink-soft border-paper-line'"
            x-text="briefingDateLabel(d)"></button>
        </template>
      </div>

      <!-- 回退提示:今日未发布 -->
      <p x-show="briefingFallback" x-cloak class="text-xs text-amber-dark bg-amber/10 rounded-lg px-3 py-2 mb-3">
        今日早报生成中,先看看最近一期
      </p>
      <div x-show="!briefingFallback" class="mb-3"></div>

      <!-- 加载骨架 -->
      <div x-show="briefingLoading" class="space-y-3">
        <div class="skeleton h-24 w-full rounded-2xl"></div>
        <div class="skeleton h-24 w-full rounded-2xl"></div>
      </div>

      <!-- 错误/空态 -->
      <div x-show="!briefingLoading && briefingError" class="text-center py-16">
        <div class="text-5xl mb-4" x-text="briefingError && briefingError.code === 'TIMEOUT' ? '📡' : '📭'"></div>
        <p class="text-ink-soft font-medium" x-text="briefingError && briefingError.code === 'TIMEOUT' ? '加载超时了' : '最近还没有早报'"></p>
        <p class="text-ink-faint text-sm mt-1">稍后再来看看吧</p>
        <button type="button" x-show="briefingError && briefingError.code === 'TIMEOUT'" @click="retryBriefing()"
          class="mt-5 bg-brand text-white rounded-xl px-6 py-2.5 font-medium">重试</button>
      </div>

      <!-- 要闻列表 -->
      <div x-show="!briefingLoading && !briefingError && briefing" class="space-y-3 lg:space-y-0 lg:grid lg:grid-cols-2 lg:gap-4">
        <template x-for="(item, idx) in (briefing ? briefing.items : [])" :key="idx">
          <article class="bg-paper-card rounded-2xl shadow-sm border border-paper-line p-4">
            <h2 class="font-bold text-ink text-[15px] leading-snug mb-2" x-text="item.title"></h2>
            <p class="text-ink-soft text-sm leading-relaxed mb-3" x-text="item.summary"></p>
            <div class="bg-brand-tint/60 rounded-xl px-3.5 py-3">
              <p class="text-xs font-semibold text-brand-dark mb-1">💡 新手解读</p>
              <p class="text-ink text-sm leading-relaxed" x-text="item.plain"></p>
            </div>
            <!-- 术语标签:点击弹解释 -->
            <div x-show="item.terms && item.terms.length" class="flex flex-wrap gap-2 mt-3">
              <template x-for="term in (item.terms || [])" :key="term">
                <button type="button" @click="openTerm(term)"
                  class="text-xs bg-paper text-brand-dark px-2.5 py-1 rounded-full border border-transparent hover:border-brand transition"
                  x-text="'#' + term"></button>
              </template>
            </div>
          </article>
        </template>
        <p class="text-center text-[11px] text-ink-faint mt-4 lg:col-span-2" x-text="briefing && briefing.disclaimer"></p>
      </div>
    </section>

    <!-- ============ 我的(F-03 收藏/复习 + F-07 打卡)============ -->
    <section x-show="route === 'me'" class="flex-1 px-5 pt-6 pb-24 lg:pb-10 lg:max-w-3xl lg:w-full lg:mx-auto lg:px-8 lg:pt-8">
      <h1 class="text-2xl font-extrabold text-ink mb-4">我的</h1>

      <!-- 账号区(阶段二)-->
      <div class="mb-4 rounded-3xl bg-paper-card p-4 shadow-soft">
        <template x-if="isAuthed">
          <div class="flex items-center justify-between">
            <div>
              <div class="text-sm text-ink-faint">已登录</div>
              <div class="text-lg font-bold text-ink num" x-text="authUser"></div>
              <div class="text-xs text-ink-faint mt-0.5">学习数据已同步到云端</div>
            </div>
            <button @click="doLogout()" class="rounded-full border border-paper-line px-4 py-2 text-sm text-ink-soft">退出登录</button>
          </div>
        </template>
        <template x-if="!isAuthed">
          <div class="flex items-center justify-between">
            <div>
              <div class="text-lg font-bold text-ink">登录后跨设备同步</div>
              <div class="text-xs text-ink-faint mt-0.5">不登录也能正常使用,数据存在本机</div>
            </div>
            <div class="flex gap-2">
              <button @click="openAuth('login')" class="rounded-full bg-brand px-4 py-2 text-sm font-bold text-white">登录</button>
              <button @click="openAuth('register')" class="rounded-full border border-brand px-4 py-2 text-sm font-bold text-brand">注册</button>
            </div>
          </div>
        </template>
      </div>

      <!-- 用户信息 + 打卡 -->
      <div class="bg-paper-card rounded-2xl border border-paper-line divide-y divide-paper-line mb-4 shadow-[0_2px_12px_rgba(42,39,36,0.04)]">
        <div class="flex justify-between px-4 py-3.5 text-sm"><span class="text-ink-soft">连续打卡</span><span class="font-bold"><span class="num text-brand-dark" x-text="streak"></span> 天</span></div>
        <div class="flex justify-between px-4 py-3.5 text-sm"><span class="text-ink-soft">身份</span><span class="font-bold" x-text="{student:'在校学生',worker:'职场新人',other:'其他'}[tags.identity]"></span></div>
        <div class="flex justify-between px-4 py-3.5 text-sm"><span class="text-ink-soft">水平档位</span><span class="font-bold" x-text="levelLabels[tags.level] || tags.level"></span></div>
        <button type="button" @click="go('onboarding')" class="w-full text-left px-4 py-3.5 text-sm text-brand font-bold">修改偏好</button>
      </div>

      <!-- 学习报告(数据聚合 + 建议生成)-->
      <div class="bg-paper-card rounded-2xl border border-paper-line mb-4 overflow-hidden shadow-[0_2px_12px_rgba(42,39,36,0.04)]" x-show="mastery">
        <div class="px-4 pt-4 pb-2 flex items-center justify-between">
          <span class="font-bold text-sm text-ink">📊 学习报告</span>
          <span class="text-xs text-ink-faint" x-show="mastery && mastery.totalAttempts"
            x-text="'已答 ' + (mastery?.totalAttempts||0) + ' 题 · 学过 ' + (mastery?.seenCardCount||0) + ' 卡'"></span>
        </div>

        <!-- 总体正确率 -->
        <div class="px-4 py-3" x-show="mastery && mastery.overallRate !== null">
          <div class="flex items-end justify-between mb-1">
            <span class="text-xs text-ink-soft">总体正确率</span>
            <span class="num text-3xl" :class="masteryRateColor" x-text="Math.round((mastery?.overallRate||0)*100) + '%'"></span>
          </div>
          <div class="h-2 bg-paper rounded-full overflow-hidden">
            <div class="h-full rounded-full transition-all" :class="masteryBarColor"
              :style="'width:' + Math.round((mastery?.overallRate||0)*100) + '%'"></div>
          </div>
        </div>

        <!-- 各主题掌握度 -->
        <div class="px-4 py-2 space-y-2" x-show="mastery && masteryAnsweredTopics.length">
          <p class="text-xs text-ink-faint">分主题掌握度</p>
          <template x-for="tp in masteryAnsweredTopics" :key="tp.topic">
            <div>
              <div class="flex justify-between text-xs mb-0.5">
                <span class="text-ink-soft" x-text="tp.label"></span>
                <span class="text-ink-faint" x-text="Math.round(tp.rate*100) + '% (' + tp.correct + '/' + tp.attempts + ')'"></span>
              </div>
              <div class="h-1.5 bg-paper rounded-full overflow-hidden">
                <div class="h-full rounded-full" :class="tp.rate>=0.8?'bg-brand':(tp.rate>=0.5?'bg-amber':'bg-clay')"
                  :style="'width:' + Math.round(tp.rate*100) + '%'"></div>
              </div>
            </div>
          </template>
        </div>

        <!-- 个性化建议 -->
        <div class="px-4 pb-4 pt-2 space-y-2" x-show="insights.length">
          <p class="text-xs text-ink-faint">给你的建议</p>
          <template x-for="(ins, i) in insights" :key="i">
            <div class="flex gap-2 text-sm rounded-xl px-3 py-2.5" :class="insightBoxClass(ins.type)">
              <span x-text="insightIcon(ins.type)"></span>
              <div class="min-w-0 flex-1">
                <p class="leading-relaxed" x-text="ins.text"></p>
                <button type="button" x-show="ins.action"
                  @click="handleInsightAction(ins.action)"
                  class="mt-1.5 inline-flex items-center gap-1 text-xs font-semibold bg-paper-card/70 hover:bg-paper-card rounded-full px-3 py-1 transition-colors"
                  x-text="(ins.action ? ins.action.label : '') + ' →'"></button>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- 收藏卡(F-03)-->
      <div class="bg-paper-card rounded-2xl border border-paper-line mb-4 overflow-hidden">
        <button type="button" @click="toggleMeSection('fav')" class="w-full flex items-center justify-between px-4 py-3.5">
          <span class="font-semibold text-sm text-ink">⭐ 我的收藏 <span class="text-ink-faint font-normal" x-text="'(' + favCards.length + ')'"></span></span>
          <span class="text-ink-faint text-xs" x-text="meExpanded === 'fav' ? '收起 ▲' : '展开 ▼'"></span>
        </button>
        <div x-show="meExpanded === 'fav'" x-cloak class="border-t border-paper-line">
          <div x-show="favCards.length === 0" class="px-4 py-8 text-center text-sm text-ink-faint">还没有收藏,去「今日」收藏喜欢的知识卡吧</div>
          <template x-for="card in favCards" :key="card.id">
            <div class="px-4 py-3 border-b border-paper-line/60 last:border-0">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <p class="font-medium text-sm text-ink" x-text="card.title"></p>
                  <p class="text-xs text-ink-faint mt-0.5" x-text="levelLabels[card.difficulty]"></p>
                </div>
                <button type="button" @click="toggleFav(card.id)" class="text-amber text-sm shrink-0">取消</button>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- 收藏术语(术语搜索来源)-->
      <div class="bg-paper-card rounded-2xl border border-paper-line mb-4 overflow-hidden">
        <button type="button" @click="toggleMeSection('terms')" class="w-full flex items-center justify-between px-4 py-3.5">
          <span class="font-semibold text-sm text-ink">📖 收藏的术语 <span class="text-ink-faint font-normal" x-text="'(' + favTerms.length + ')'"></span></span>
          <span class="text-ink-faint text-xs" x-text="meExpanded === 'terms' ? '收起 ▲' : '展开 ▼'"></span>
        </button>
        <div x-show="meExpanded === 'terms'" x-cloak class="border-t border-paper-line">
          <div x-show="favTerms.length === 0" class="px-4 py-8 text-center text-sm text-ink-faint">还没有收藏术语,在「今日」搜索栏查词后可收藏</div>
          <template x-for="term in favTerms" :key="term">
            <div class="px-4 py-3 border-b border-paper-line/60 last:border-0 flex items-center justify-between gap-2">
              <button type="button" @click="openTerm(term)" class="min-w-0 text-left flex-1">
                <span class="font-medium text-sm text-brand-dark" x-text="'#' + term"></span>
                <span class="block text-xs text-ink-faint mt-0.5 truncate" x-text="glossary[term]"></span>
              </button>
              <button type="button" @click="toggleTermFav(term)" class="text-amber text-sm shrink-0">取消</button>
            </div>
          </template>
        </div>
      </div>

      <!-- 复习池(F-03,答错题重做)-->
      <div id="me-review-section" class="bg-paper-card rounded-2xl border border-paper-line mb-4 overflow-hidden scroll-mt-4">
        <button type="button" @click="toggleMeSection('review')" class="w-full flex items-center justify-between px-4 py-3.5">
          <span class="font-semibold text-sm text-ink">📝 待复习错题 <span class="text-ink-faint font-normal" x-text="'(' + reviewItems.length + ')'"></span></span>
          <span class="text-ink-faint text-xs" x-text="meExpanded === 'review' ? '收起 ▲' : '展开 ▼'"></span>
        </button>
        <div x-show="meExpanded === 'review'" x-cloak class="border-t border-paper-line">
          <div x-show="reviewItems.length === 0" class="px-4 py-8 text-center text-sm text-ink-faint">太棒了,没有待复习的错题 🎉</div>
          <template x-for="item in reviewItems" :key="item.quizId">
            <div class="px-4 py-3 border-b border-paper-line/60 last:border-0 flex items-start justify-between gap-2">
              <div class="min-w-0">
                <p class="text-sm text-ink line-clamp-2" x-text="item.quiz.stem"></p>
                <p class="text-xs text-ink-faint mt-0.5" x-text="'答错于 ' + item.wrongAt"></p>
              </div>
              <button type="button" @click="startReview(item)" class="text-brand text-sm font-medium shrink-0">重做</button>
            </div>
          </template>
        </div>
      </div>

      <button type="button" @click="resetAll()" class="w-full text-center py-3 text-xs text-ink-faint">清除全部数据(开发用)</button>
    </section>

    <!-- ============ 底部 Tab(onboarding 时隐藏;桌面用侧边栏,故 lg:hidden)============ -->
    <nav x-show="route !== 'onboarding'" class="lg:hidden fixed bottom-0 inset-x-0 max-w-md mx-auto bg-paper-card/95 backdrop-blur border-t border-paper-line grid grid-cols-3 pb-safe-nav shadow-[0_-2px_16px_rgba(42,39,36,0.05)]">
      <template x-for="tab in [{k:'home',t:'今日',i:'📖'},{k:'briefing',t:'早报',i:'📰'},{k:'me',t:'我的',i:'👤'}]" :key="tab.k">
        <button type="button" @click="go(tab.k)" class="py-2.5 flex flex-col items-center gap-0.5 transition"
          :class="route === tab.k ? 'text-brand' : 'text-ink-faint'">
          <span class="text-lg transition-transform" :class="route === tab.k ? 'scale-110' : ''" x-text="tab.i"></span>
          <span class="text-[11px] font-bold" x-text="tab.t"></span>
        </button>
      </template>
    </nav>

    <!-- ============ 测验浮层(F-02,答题→判定→解析)============ -->
    <div x-show="quizOpen" x-cloak class="fixed inset-0 z-40 flex items-end justify-center lg:items-center" @click="closeQuiz()">
      <div class="absolute inset-0 bg-black/40"></div>
      <div class="relative bg-paper-card rounded-t-2xl lg:rounded-2xl w-full max-w-md p-5 pb-safe-sheet lg:pb-5 max-h-[85vh] overflow-y-auto" @click.stop>
        <div class="flex items-center justify-between mb-4">
          <span class="text-xs bg-amber/10 text-amber-dark px-2.5 py-1 rounded-full font-medium">小测验</span>
          <button type="button" @click="closeQuiz()" class="text-ink-faint text-2xl leading-none">×</button>
        </div>

        <template x-if="activeQuiz">
          <div>
            <h3 class="text-base font-bold text-ink mb-4 leading-relaxed" x-text="activeQuiz.stem"></h3>

            <!-- 选项 -->
            <div class="space-y-2.5">
              <template x-for="(opt, idx) in activeQuiz.options" :key="idx">
                <button type="button" @click="selectOption(idx)"
                  class="w-full text-left border rounded-xl px-4 py-3 text-sm transition flex items-center gap-3"
                  :class="optionClass(idx)">
                  <span class="w-5 h-5 rounded-full border flex items-center justify-center text-xs shrink-0"
                    :class="optionBadgeClass(idx)" x-text="optionBadge(idx)"></span>
                  <span x-text="opt"></span>
                </button>
              </template>
            </div>

            <!-- 解析(判定后展示)-->
            <div x-show="quizAnswered" x-cloak class="mt-4 rounded-2xl p-4"
              :class="quizIsCorrect ? 'bg-brand-tint' : 'bg-clay-tint'">
              <p class="font-bold text-sm mb-1" :class="quizIsCorrect ? 'text-brand-dark' : 'text-clay-dark'"
                x-text="quizIsCorrect ? '答对了 🎉' : '答错了,看看解析'"></p>
              <p class="text-ink-soft text-sm leading-relaxed" x-text="activeQuiz.explain"></p>
              <p x-show="diffChangeLabel" class="text-xs text-amber-dark mt-2 font-bold" x-text="diffChangeLabel"></p>
            </div>

            <!-- 操作区 -->
            <div class="mt-5">
              <button type="button" x-show="!quizAnswered" @click="submitQuiz()" :disabled="selectedOption === null"
                :class="selectedOption === null ? 'bg-paper-line text-ink-faint' : 'bg-brand text-white'"
                class="w-full rounded-xl py-3 font-semibold transition">提交答案</button>
              <button type="button" x-show="quizAnswered" @click="closeQuiz()"
                class="w-full rounded-xl py-3 font-semibold bg-brand text-white">完成</button>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- ============ 术语弹层(F-05,全局共用)============ -->
    <div x-show="activeTerm" x-cloak class="fixed inset-0 z-40 flex items-end justify-center lg:items-center" @click="closeTerm()">
      <div class="absolute inset-0 bg-black/40"></div>
      <div class="relative bg-paper-card rounded-t-2xl lg:rounded-2xl w-full max-w-md p-5 pb-safe-sheet lg:pb-5" @click.stop>
        <div class="flex items-center justify-between mb-2">
          <h3 class="font-bold text-brand-dark" x-text="activeTerm"></h3>
          <button type="button" @click="closeTerm()" class="text-ink-faint text-xl leading-none">×</button>
        </div>
        <p class="text-ink-soft text-sm leading-relaxed" x-text="activeTermText"></p>
      </div>
    </div>

    <!-- 登录/注册弹层 -->
    <div x-show="authOpen" x-cloak class="fixed inset-0 z-50 flex items-end lg:items-center justify-center bg-ink/40" @click.self="closeAuth()">
      <div class="w-full lg:max-w-sm rounded-t-3xl lg:rounded-3xl bg-paper-card p-6 pb-safe-sheet shadow-soft">
        <div class="mb-4 text-center text-lg font-bold text-ink" x-text="authMode === 'login' ? '登录' : '注册'"></div>
        <input x-model="authForm.username" type="text" placeholder="用户名"
               class="mb-3 w-full rounded-2xl border border-paper-line bg-paper px-4 py-3 text-ink" autocomplete="off">
        <input x-model="authForm.password" type="password" placeholder="密码"
               class="mb-2 w-full rounded-2xl border border-paper-line bg-paper px-4 py-3 text-ink"
               @keydown.enter="authMode === 'login' ? doLogin() : doRegister()">
        <div x-show="authError" x-text="authError" class="mb-2 text-sm text-clay"></div>
        <button @click="authMode === 'login' ? doLogin() : doRegister()" :disabled="authBusy"
                class="mb-3 w-full rounded-2xl bg-brand py-3 font-bold text-white disabled:opacity-60"
                x-text="authBusy ? '请稍候…' : (authMode === 'login' ? '登录' : '注册并登录')"></button>
        <div class="text-center text-sm text-ink-faint">
          <span x-text="authMode === 'login' ? '还没有账号?' : '已有账号?'"></span>
          <button @click="switchAuthMode()" class="text-brand font-bold" x-text="authMode === 'login' ? '去注册' : '去登录'"></button>
        </div>
        <button @click="closeAuth()" class="mt-2 w-full py-2 text-sm text-ink-faint">取消</button>
      </div>
    </div>

  </main>

  </div>
  <!-- /桌面包裹层 -->

  <script type="module" src="./js/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    // 注册 Service Worker(PWA 离线,技术方案 §10)。file:// 下不支持,静默跳过。
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((e) => {
          console.warn('[sw] register failed:', e);
        });
      });
    }
  </script>
</body>
</html>
